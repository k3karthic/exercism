[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "httpx2>=2.12.0",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
    "urllib3>=2.7.0,<3.0.0",
    "kafka-python>=2.3.1",
    "memray>=1.19.3",
    "numpy>=2.4.6",
    "pika>=1.3.2",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.10.1",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-distro>=0.51b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "opentelemetry-sdk==1.44.0",
    "redis>=7.4.0",
    "jinja2>=3.1.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "viztracer>=1.1.1",
    "temporalio==1.30.0",
    "alembic>=1.20.0",
]

[tool.ruff]
line-length = 120
exclude = [
    "openapi/generated",
    "openapi/alembic/versions",
    "cpu_memory_visualization",
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "A", "ARG", "C90", "I", "N", "PL", "T100"]
preview = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-bool-expr = 5
max-locals = 15
max-public-methods = 20
max-returns = 6
max-statements = 50

[tool.ty.environment]
root = [".", "concurrency", "durable_execution", "grpc_exercise"]

[tool.ty.src]
exclude = [
    "openapi/generated",
    "openapi/alembic/versions",
    "cpu_memory_visualization",
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning:testcontainers\\.(keycloak|rabbitmq|redis)(\\..*)?",
    "ignore:The wait_for_logs function with string or callable predicates is deprecated.*:DeprecationWarning:testcontainers\\.keycloak(\\..*)?",
]

[tool.coverage.run]
source = ["."]
omit = [
    "**/test*.py",
    "**/*_test.py",
    "**/tests/**",
    "openapi/generated/**",
    "openapi/alembic/versions/**",
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.1",
    "testcontainers[keycloak,postgres,rabbitmq,redis]>=4.14.2",
    "vulture>=2.16",
]
