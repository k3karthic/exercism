<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Keycloak + FastAPI</p>
      <h1>Welcome, {{ user_name }}</h1>
      <p class="subtitle">Your session is stored on the server and validated with Keycloak.</p>

      <form action="/logout" method="post">
        <button type="submit">Logout</button>
      </form>
    </main>
  </body>
</html>
