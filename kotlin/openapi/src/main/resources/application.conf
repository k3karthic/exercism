ktor {
  deployment {
    environment = development
    port = 8080
    autoreload = true
    watch = [ com.github.k3karthic.openapi ]
  }

  application {
    modules = [ com.github.k3karthic.openapi.MainKt.module ]
  }
}

db {
  jdbcUrl = "jdbc:postgresql://localhost:5432/petstore"
  jdbcUrl = ${?DB_JDBC_URL}
  r2dbcUrl = "r2dbc:postgresql://localhost:5432/petstore"
  r2dbcUrl = ${?DB_R2DBC_URL}
  user = "petstore"
  user = ${?DB_USER}
  password = "petstore"
  password = ${?DB_PASSWORD}
}
